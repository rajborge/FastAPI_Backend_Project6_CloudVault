services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cloudvault_test
      POSTGRES_USER: cloudvault_test
      POSTGRES_PASSWORD: test-only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudvault_test -d cloudvault_test"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
