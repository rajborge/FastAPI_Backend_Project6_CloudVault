services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-cloudvault}
      POSTGRES_USER: ${DB_USERNAME:-cloudvault}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cloudvault} -d ${DB_NAME:-cloudvault}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  clamav:
    image: clamav/clamav:1.4
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav

  api:
    build: .
    image: cloudvault-app:local
    env_file: .env
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    volumes:
      - cloudvault_uploads:/app/uploads
      - cloudvault_logs:/app/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    image: cloudvault-app:local
    env_file: .env
    command: celery -A app.core.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    volumes:
      - cloudvault_uploads:/app/uploads

volumes:
  postgres_data:
  clamav_data:
  cloudvault_uploads:
  cloudvault_logs:
