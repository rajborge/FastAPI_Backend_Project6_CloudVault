name: CloudVault checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cloudvault_test
          POSTGRES_USER: cloudvault_test
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cloudvault_test -d cloudvault_test" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: cloudvault_test
      DB_USERNAME: cloudvault_test
      DB_PASSWORD: test-only
      TEST_DATABASE_URL: postgresql+psycopg://cloudvault_test:test-only@127.0.0.1:5432/cloudvault_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: python -m pip install -r requirements.txt pip-audit
      - run: python scripts/verify_migrations.py
      - run: python -m pytest -q
      - run: python -m pip_audit -r requirements.txt
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build && npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm audit --audit-level=high
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 dir /repo --redact --no-banner
